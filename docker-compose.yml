services:
  postgres:
    image: postgres:17
    container_name: aijob-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s


  mongodb:
    image: mongo:7
    container_name: aijob-mongodb
    restart: unless-stopped
    command: ["mongod", "--quiet"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/27017"]

      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s

  qdrant:
    image: qdrant/qdrant
    container_name: aijob-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    # No healthcheck – the Python code will retry until Qdrant is ready

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aijob-api
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      MONGODB_URI: mongodb://jobagent:Vikrant%40mongodb%40123@mongodb:27017/?authSource=admin
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    depends_on:
      - postgres
      - mongodb
      - qdrant   # No condition – we rely on retry logic in Python
    volumes:
      - ./database:/app/database
      - ./logs:/app/logs
      - ./outputs:/app/outputs
      - hf_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: aijob-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  mongo_data:
  qdrant_data:
  hf_cache:
