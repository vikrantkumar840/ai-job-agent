apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: ai-job-agent
data:
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "aijobagent"

  MONGODB_DATABASE: "aijobagent"

  QDRANT_HOST: "qdrant"
  QDRANT_PORT: "6333"

  JWT_ALGORITHM: "HS256"
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "60"

  CORS_ALLOWED_ORIGINS: "https://YOUR_DOMAIN.com,https://www.YOUR_DOMAIN.com"
  NEXT_PUBLIC_API_URL: "https://api.YOUR_DOMAIN.com"
  API_URL: "https://api.YOUR_DOMAIN.com"
